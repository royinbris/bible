<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b51b50"/>
      <stop offset="1" stop-color="#8e1138"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e3"/>
      <stop offset="1" stop-color="#ecdcbd"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="0" fill="url(#bg)"/>

  <g filter="url(#sh)">
    <!-- book cover -->
    <rect x="136" y="120" width="240" height="280" rx="18" fill="url(#cover)"/>
    <!-- spine -->
    <rect x="136" y="120" width="26" height="280" rx="10" fill="#d8c39a"/>
    <!-- inner frame -->
    <rect x="178" y="148" width="170" height="224" rx="8" fill="none" stroke="#c9a24b" stroke-width="5"/>
  </g>

  <!-- cross -->
  <g fill="#a31545">
    <rect x="248" y="186" width="22" height="150" rx="6"/>
    <rect x="214" y="232" width="90" height="22" rx="6"/>
  </g>

  <!-- ribbon bookmark -->
  <path d="M300 120 h28 v118 l-14 -16 -14 16 z" fill="#c9a24b"/>
</svg>
